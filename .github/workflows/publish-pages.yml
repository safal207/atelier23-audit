name: Publish Atelier 23 audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atelier23-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --init --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
      - run: node scripts/atelier23-audit-mobile.mjs && node scripts/atelier23-emotional-audit.mjs && node scripts/atelier23-client-preview.mjs
        env:
          HOME: /root
          AUDIT_BROWSER: chromium
      - name: Package only the approved static site
        run: |
          mkdir -p _site
          cp index.html gentleman-hero.webp chapter-01-desire.webp chapter-02-search.webp chapter-03-fitting.webp .nojekyll _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - run: sleep 20
      - uses: actions/deploy-pages@v4
        id: deployment
