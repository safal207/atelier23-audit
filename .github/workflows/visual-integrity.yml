name: Visual Integrity 7.5 (branch only)
on:
  push:
    branches: ['audit/premium-trust-7.3']
permissions:
  contents: read
jobs:
  visual:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --init --ipc=host
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0 axe-core@4.10.3
      - run: node scripts/atelier23-visual-integrity.mjs
        env:
          AUDIT_BROWSER: ${{ matrix.browser }}
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-integrity-${{ matrix.browser }}
          path: artifacts/visual-integrity/
