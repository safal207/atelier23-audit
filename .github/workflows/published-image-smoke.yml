name: Published audit image smoke (read-only)
on:
  push:
    branches: ['audit/premium-trust-7.3']
    paths: ['.github/workflows/published-image-smoke.yml']
permissions:
  contents: read
jobs:
  public-image-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --init --ipc=host
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
      - name: Check currently published version 7.2 without changing it
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const browser=await chromium.launch({headless:true});
          const url='https://safal207.github.io/atelier23-audit/';
          const files=['gentleman-hero.webp','chapter-01-desire.webp','chapter-02-search.webp','chapter-03-fitting.webp'];
          try{
            const page=await browser.newPage({viewport:{width:390,height:850},isMobile:true,hasTouch:true});
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(response.status(),200);
            for(const name of files){
              const r=await page.request.get(new URL(name,url).href);
              assert.equal(r.status(),200,name);
              assert.match(r.headers()['content-type'],/^image\/webp/i);
              assert.deepEqual(await r.body(),await readFile(name),name+' bytes');
              const image=page.locator('img[src="'+name+'"]');
              assert.equal(await image.count(),1);
              await image.scrollIntoViewIfNeeded();await image.evaluate(i=>i.decode());
              const size=await image.evaluate(i=>[i.naturalWidth,i.naturalHeight]);
              assert.ok(size[0]>0&&size[1]>0);
              console.log('PASS public image HTTP 200 / bytes / decode: '+name+' '+size.join('x'));
            }
            for(const card of await page.locator('details[data-ea]').all()){await card.locator('summary').click();assert.ok(await card.locator('.ea-metric').isVisible());}
            const img=page.locator('#ea-search-frame img');
            await img.scrollIntoViewIfNeeded();await img.evaluate(i=>i.decode());
            assert.ok(await img.evaluate(i=>i.naturalWidth>0));
            console.log('PASS public chapter interaction and evidence image decode');
          }finally{await browser.close()}
          JS
