name: Publish isolated review 7.6
on:
  push:
    branches: ['release/preview-7.6']
permissions:
  contents: read
concurrency:
  group: atelier23-pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve production and pin approved review bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "b6a1d084c07ceef0ce8f7600805b7678c3453a39"
          mkdir -p _site/preview-7.6
          for f in index.html gentleman-hero.webp chapter-01-desire.webp chapter-02-search.webp chapter-03-fitting.webp; do
            test "$(git hash-object "$f")" = "$(git rev-parse b6a1d084c07ceef0ce8f7600805b7678c3453a39:"$f")"
            test "$(git hash-object "preview-7.6/$f")" = "$(git rev-parse bf0f0e084b5a9419d15212d6bcc3e45d9f53da7d:"$f")"
            cp "$f" _site/
            cp "preview-7.6/$f" _site/preview-7.6/
          done
          cp .nojekyll _site/
          python3 scripts/build-author-77.py _site/preview-7.7
          python3 scripts/build-author-78.py _site/preview-7.8
      - name: Verify both versions before replacing the existing client URL
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/compare.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/preview-7.7/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/author-78-qa.mjs
          mv _site/preview-7.7 _site/preview-7.7-original
          cp -a _site/preview-7.8 _site/preview-7.7
          diff -qr _site/preview-7.8 _site/preview-7.7
          test -f _site/preview-7.7-original/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
